<app-entity-sheet
  [(open)]="open"
  [title]="isNew ? 'New project' : 'Edit ' + draft().name"
  [canSave]="f().valid()"
  [showDelete]="!isNew"
  (saved)="save()"
  (deleted)="removeCurrent()"
>
  <div class="grid gap-4">
    <app-field label="Project name" [error]="fieldError(f.name())">
      <input hlmInput class="w-full" [formField]="f.name" placeholder="Marketing site redesign" />
    </app-field>
    <div class="grid gap-4 sm:grid-cols-2">
      <app-field label="Client" [error]="fieldError(f.clientId())">
        <hlm-select class="w-full" [formField]="f.clientId" [itemToString]="clientLabel">
          <hlm-select-trigger class="w-full">
            <hlm-select-value placeholder="Select a client" />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            @for (c of clients(); track c.id) {
              <hlm-select-item [value]="c.id">{{ c.company || c.name }}</hlm-select-item>
            }
          </hlm-select-content>
        </hlm-select>
      </app-field>
      <app-field label="Status">
        <hlm-select class="w-full" [formField]="f.status" [itemToString]="statusLabel">
          <hlm-select-trigger class="w-full">
            <hlm-select-value />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            <hlm-select-item value="planning">Planning</hlm-select-item>
            <hlm-select-item value="active">Active</hlm-select-item>
            <hlm-select-item value="on_hold">On hold</hlm-select-item>
            <hlm-select-item value="completed">Completed</hlm-select-item>
          </hlm-select-content>
        </hlm-select>
      </app-field>
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <app-field label="Budget">
        <input hlmInput type="number" class="w-full" [formField]="f.budget" />
      </app-field>
      <app-field label="Hourly rate">
        <input hlmInput type="number" class="w-full" [formField]="f.hourlyRate" />
      </app-field>
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <app-field label="Start date">
        <app-date-field
          [value]="f.startDate().value()"
          (valueChange)="f.startDate().value.set($event ?? '')"
        />
      </app-field>
      <app-field label="End date">
        <app-date-field
          [value]="f.endDate().value()"
          (valueChange)="f.endDate().value.set($event ?? '')"
        />
      </app-field>
    </div>
    <app-field label="Description">
      <textarea hlmTextarea rows="3" class="w-full" [formField]="f.description"></textarea>
    </app-field>
  </div>
</app-entity-sheet>
