<div class="mx-auto max-w-[1200px] px-4 py-8 md:px-8">
  <div class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight sm:text-[28px]">
      Payments
    </h1>
    <p class="mt-1 text-sm text-muted-foreground">
      Your payment history - each payment shows the invoice and project it paid for.
    </p>
  </div>

  @if (loading()) {
    <div class="surface-card px-6 py-10 text-center text-sm text-muted-foreground">
      Loading…
    </div>
  } @else if (payments().length === 0) {
    <app-empty-state
      title="No payments yet"
      description="Payments will appear here once recorded."
    />
  } @else {
    <div
      class="mb-4 flex items-center gap-3 rounded-lg border border-border bg-surface px-4 py-3"
    >
      <div
        class="grid h-9 w-9 place-items-center rounded-lg bg-success/15 text-success"
      >
        <ng-icon name="lucideWallet" size="18" />
      </div>
      <div>
        <p class="text-xs text-muted-foreground">Total paid to date</p>
        <p class="text-lg font-semibold tabular-nums">
          {{ money(totalPaid(), currency()) }}
        </p>
      </div>
    </div>

    <app-payment-table [payments]="payments()" />
  }
</div>
