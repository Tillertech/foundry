<div class="mx-auto max-w-[760px] px-4 py-8 md:px-8">
  <div class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight sm:text-[28px]">
      Profile
    </h1>
    <p class="mt-1 text-sm text-muted-foreground">
      Your portal account.
    </p>
  </div>

  <section class="surface-card mb-4 p-5">
    <h2 class="mb-4 text-sm font-semibold">Account</h2>
    <div class="mb-5 flex items-center gap-4">
      <div
        class="grid h-16 w-16 place-items-center rounded-full bg-gradient-to-br from-primary to-primary/60 text-lg font-semibold text-primary-foreground"
      >
        {{ initials() }}
      </div>
      <div class="text-xs text-muted-foreground">
        <p class="font-medium text-foreground">{{ me()?.name }}</p>
        <p>{{ me()?.email }}</p>
        @if (me(); as m) {
          <p class="mt-1 capitalize">{{ m.status }}</p>
        }
      </div>
    </div>
  </section>

  <section class="surface-card p-5">
    <h2 class="mb-4 flex items-center gap-2 text-sm font-semibold">
      <ng-icon name="lucideKeyRound" size="16" class="text-muted-foreground" />
      Password
    </h2>
    <p class="mb-4 text-xs text-muted-foreground">
      To change your password, request a reset link - you'll be signed out
      and asked to sign back in with the new one.
    </p>
    <a routerLink="/forgot-password" hlmBtn variant="outline" size="sm">
      Reset password
    </a>
  </section>
</div>
